<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- No user-scalable=no / maximum-scale: blocking zoom fails WCAG 2.2 1.4.4 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Wizball</title>
  <meta name="description" content="A browser port of Wizball, the 1987 Ocean / Sensible Software classic. Bounce, collect paint, restore colour to the world. Plays with keyboard, gamepad or touch — no install.">
  <meta name="theme-color" content="#000000">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Wizball">
  <meta property="og:title" content="Wizball">
  <meta property="og:description" content="A browser port of Wizball, the 1987 Ocean / Sensible Software classic. Bounce, collect paint, restore colour to the world. Plays with keyboard, gamepad or touch — no install.">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Wizball">
  <meta name="twitter:description" content="A browser port of Wizball, the 1987 Ocean / Sensible Software classic. Plays with keyboard, gamepad or touch — no install.">

  <!-- Inline favicon (a little Wizball) so the browser doesn't 404 on /favicon.ico -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3CradialGradient id='g' cx='38%25' cy='32%25' r='70%25'%3E%3Cstop offset='0' stop-color='%2399ddff'/%3E%3Cstop offset='1' stop-color='%23114488'/%3E%3C/radialGradient%3E%3Ccircle cx='16' cy='16' r='14' fill='url(%23g)' stroke='%23ffffff' stroke-width='1.5'/%3E%3C/svg%3E">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #game-container {
      width: 100%;
      height: 100%;
      max-width: 1280px;
      max-height: 832px;
    }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    canvas:focus-visible {
      outline: 2px solid #99ddff;
      outline-offset: 2px;
    }

    /* Settings > Graphics > Show FPS. Positioned by main.ts, hidden by default. */
    #fps-readout {
      display: none;
      position: fixed;
      top: 6px;
      left: 8px;
      z-index: 60;
      pointer-events: none;
      font: 700 12px/1 ui-monospace, monospace;
      color: #9fe89f;
      background: rgba(0, 0, 0, 0.55);
      padding: 3px 6px;
      border-radius: 4px;
    }

    /* ---- No-JS / rotate prompts ---- */
    .overlay-message {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      background: #05070d;
      color: #cfe8ff;
      font-family: ui-monospace, monospace;
    }
    .overlay-message h1 { font-size: 20px; }
    .overlay-message p { font-size: 14px; max-width: 34em; line-height: 1.5; }
    .overlay-message button {
      font: inherit;
      font-size: 14px;
      color: #cfe8ff;
      background: rgba(40, 60, 100, 0.6);
      border: 2px solid rgba(150, 200, 255, 0.6);
      border-radius: 8px;
      padding: 10px 18px;
      min-height: 44px;
      cursor: pointer;
    }
    .overlay-message button:focus-visible {
      outline: 2px solid #99ddff;
      outline-offset: 2px;
    }

    /* Phaser's FIT scale leaves a ~390x253 canvas floating in a portrait phone
       viewport with the touch buttons stranded below it, so ask for landscape. */
    #rotate-prompt { display: none; }

    /* ---- On-screen touch controls ---- */
    #touch-controls {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 50;
      pointer-events: none; /* container is transparent; only buttons capture touches */
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    /* Set by window.__wizTouchUI (see below) from the Settings > Touch Controls
       option: 'auto' shows these only on a coarse pointer. */
    body.touch-ui #touch-controls { display: block; }
    /* Hidden while a menu overlay owns the screen (Settings) — the D-pad and
       FIRE do nothing there, and they sit on top of the menu. */
    body.touch-hidden #touch-controls { display: none; }

    .tc-btn {
      position: absolute;
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      appearance: none;
      -webkit-appearance: none;
      color: #cfe8ff;
      font-family: ui-monospace, monospace;
      font-weight: 700;
      background: rgba(40, 60, 100, 0.38);
      border: 2px solid rgba(150, 200, 255, 0.5);
      border-radius: 14px;
      backdrop-filter: blur(2px);
      transition: background 0.05s;
      touch-action: none;
      cursor: pointer;
    }
    .tc-btn.active { background: rgba(120, 180, 255, 0.7); }
    .tc-btn:focus-visible { outline: 2px solid #99ddff; outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) {
      .tc-btn { transition: none; }
    }

    /* D-pad, bottom-left */
    #tc-up    { left: 78px;  bottom: 150px; width: 64px; height: 64px; font-size: 26px; }
    #tc-down  { left: 78px;  bottom: 18px;  width: 64px; height: 64px; font-size: 26px; }
    #tc-left  { left: 12px;  bottom: 84px;  width: 64px; height: 64px; font-size: 26px; }
    #tc-right { left: 144px; bottom: 84px;  width: 64px; height: 64px; font-size: 26px; }

    /* Fire buttons, bottom-right */
    #tc-fire { right: 22px;  bottom: 40px; width: 104px; height: 104px; border-radius: 50%;
               font-size: 20px; background: rgba(120, 40, 40, 0.45); border-color: rgba(255, 140, 140, 0.6); color: #ffdddd; }
    #tc-fire.active { background: rgba(255, 90, 90, 0.75); }
    #tc-alt  { right: 138px; bottom: 30px; width: 60px;  height: 60px; border-radius: 50%; font-size: 22px; }

    /* Pause, top-right — out of the way of the thumbs */
    #tc-pause { right: 12px; top: 12px; width: 58px; height: 44px; font-size: 16px; border-radius: 10px; }

    /* Portrait on a real touch device: hide the controls and ask for landscape
       instead. Declared after the .touch-ui rule so it wins on equal specificity. */
    @media (orientation: portrait) and (pointer: coarse) {
      body:not(.rotate-dismissed) #rotate-prompt { display: flex; }
      body:not(.rotate-dismissed) #touch-controls { display: none; }
    }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <noscript>
    <div class="overlay-message">
      <h1>Wizball needs JavaScript</h1>
      <p>This is a browser port of the 1987 Amiga game, and the whole thing runs in
         JavaScript. Enable it for this site (or drop the strict-blocking extension)
         and reload to play.</p>
    </div>
  </noscript>

  <!-- Not aria-modal: nothing traps focus here, and the dismiss button is the
       only control, so promising modality would be a lie to a screen reader. -->
  <div id="rotate-prompt" class="overlay-message" role="dialog" aria-labelledby="rotate-title">
    <h1 id="rotate-title">Turn your phone sideways</h1>
    <p>Wizball is a wide-screen game. In portrait the picture shrinks to a strip and
       the on-screen controls end up off the play area.</p>
    <button type="button" id="rotate-dismiss">Play in portrait anyway</button>
  </div>

  <div id="touch-controls">
    <button type="button" class="tc-btn" id="tc-up"    data-act="moveUp"    aria-label="Move up"><span aria-hidden="true">&#9650;</span></button>
    <button type="button" class="tc-btn" id="tc-down"  data-act="moveDown"  aria-label="Move down"><span aria-hidden="true">&#9660;</span></button>
    <button type="button" class="tc-btn" id="tc-left"  data-act="moveLeft"  aria-label="Move left"><span aria-hidden="true">&#9664;</span></button>
    <button type="button" class="tc-btn" id="tc-right" data-act="moveRight" aria-label="Move right"><span aria-hidden="true">&#9654;</span></button>
    <button type="button" class="tc-btn" id="tc-fire"  data-act="fire"      aria-label="Fire">FIRE</button>
    <button type="button" class="tc-btn" id="tc-alt"   data-act="altFire"   aria-label="Alt fire and bonus select"><span aria-hidden="true">Z</span></button>
    <button type="button" class="tc-btn" id="tc-pause" data-act="pause"     aria-label="Pause and open the menu"><span aria-hidden="true">II</span></button>
  </div>

  <script>
    // Virtual input state read by the game's InputManager (src/systems/InputManager.ts).
    window.__wizTouch = { moveUp:false, moveDown:false, moveLeft:false, moveRight:false, fire:false, altFire:false, pause:false };

    (function () {
      var buttons = document.querySelectorAll('.tc-btn');

      function set(el, act, on) {
        window.__wizTouch[act] = on;
        el.classList.toggle('active', on);
      }
      function releaseAll() {
        for (var k in window.__wizTouch) window.__wizTouch[k] = false;
        buttons.forEach(function (el) { el.classList.remove('active'); });
      }

      buttons.forEach(function (el) {
        var act = el.getAttribute('data-act');
        var down = function (e) { e.preventDefault(); e.stopPropagation(); set(el, act, true); };
        var up   = function (e) { e.preventDefault(); e.stopPropagation(); set(el, act, false); };
        el.addEventListener('pointerdown', down);
        el.addEventListener('pointerup', up);
        el.addEventListener('pointercancel', up);
        el.addEventListener('pointerleave', up);
        el.addEventListener('contextmenu', function (e) { e.preventDefault(); });
        // These are real <button>s so they are keyboard reachable; hold-to-press
        // via Enter/Space keeps them from being focusable no-ops.
        el.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); set(el, act, true); }
        });
        el.addEventListener('keyup', function (e) {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); set(el, act, false); }
        });
        el.addEventListener('blur', function () { set(el, act, false); });
      });

      // 'ontouchstart' in window / maxTouchPoints > 0 are true on every Surface and
      // touch-enabled laptop, which handed those users a permanent D-pad over the
      // game. '(pointer: coarse)' means the *primary* pointer is a finger.
      var mq = window.matchMedia ? window.matchMedia('(pointer: coarse)') : null;
      var coarse = mq ? mq.matches : false;
      var mode = 'auto';

      function applyMode() {
        var on = (mode === 'on') || (mode === 'auto' && coarse);
        document.body.classList.toggle('touch-ui', on);
        if (!on) releaseAll();
      }

      if (mq && mq.addEventListener) {
        mq.addEventListener('change', function (e) { coarse = e.matches; applyMode(); });
      }

      // Settings > Graphics > Touch Controls drives this (src/config/Settings.ts).
      window.__wizTouchUI = {
        setMode: function (m) {
          mode = (m === 'on' || m === 'off') ? m : 'auto';
          applyMode();
        },
        // Temporarily stow the overlay while a full-screen menu is up.
        setHidden: function (hidden) {
          document.body.classList.toggle('touch-hidden', !!hidden);
          if (hidden) releaseAll();
        },
        isCoarse: function () { return coarse; }
      };
      applyMode();

      var dismiss = document.getElementById('rotate-dismiss');
      if (dismiss) {
        dismiss.addEventListener('click', function () {
          document.body.classList.add('rotate-dismissed');
        });
      }

      // Safety: release everything if the page loses focus / visibility.
      window.addEventListener('blur', releaseAll);
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) releaseAll();
      });
    })();
  </script>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
