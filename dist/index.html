<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Wizball - Phaser 3 Remake</title>
  <!-- Inline favicon (a little Wizball) so the browser doesn't 404 on /favicon.ico -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3CradialGradient id='g' cx='38%25' cy='32%25' r='70%25'%3E%3Cstop offset='0' stop-color='%2399ddff'/%3E%3Cstop offset='1' stop-color='%23114488'/%3E%3C/radialGradient%3E%3Ccircle cx='16' cy='16' r='14' fill='url(%23g)' stroke='%23ffffff' stroke-width='1.5'/%3E%3C/svg%3E">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #game-container {
      width: 100%;
      height: 100%;
      max-width: 1280px;
      max-height: 832px;
    }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* ---- On-screen touch controls (mobile only) ---- */
    #touch-controls {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 50;
      pointer-events: none; /* container is transparent; only buttons capture touches */
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    body.touch #touch-controls { display: block; }

    .tc-btn {
      position: absolute;
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #cfe8ff;
      font-family: ui-monospace, monospace;
      font-weight: 700;
      background: rgba(40, 60, 100, 0.38);
      border: 2px solid rgba(150, 200, 255, 0.5);
      border-radius: 14px;
      backdrop-filter: blur(2px);
      transition: background 0.05s;
    }
    .tc-btn.active { background: rgba(120, 180, 255, 0.7); }

    /* D-pad, bottom-left */
    #tc-up    { left: 78px;  bottom: 150px; width: 64px; height: 64px; font-size: 26px; }
    #tc-down  { left: 78px;  bottom: 18px;  width: 64px; height: 64px; font-size: 26px; }
    #tc-left  { left: 12px;  bottom: 84px;  width: 64px; height: 64px; font-size: 26px; }
    #tc-right { left: 144px; bottom: 84px;  width: 64px; height: 64px; font-size: 26px; }

    /* Fire buttons, bottom-right */
    #tc-fire { right: 22px;  bottom: 40px; width: 104px; height: 104px; border-radius: 50%;
               font-size: 20px; background: rgba(120, 40, 40, 0.45); border-color: rgba(255, 140, 140, 0.6); color: #ffdddd; }
    #tc-fire.active { background: rgba(255, 90, 90, 0.75); }
    #tc-alt  { right: 138px; bottom: 30px; width: 60px;  height: 60px; border-radius: 50%; font-size: 22px; }
  </style>
  <script type="module" crossorigin src="/assets/index-X4m5e12F.js"></script>
</head>
<body>
  <div id="game-container"></div>

  <div id="touch-controls">
    <div class="tc-btn" id="tc-up"    data-act="moveUp">▲</div>
    <div class="tc-btn" id="tc-down"  data-act="moveDown">▼</div>
    <div class="tc-btn" id="tc-left"  data-act="moveLeft">◀</div>
    <div class="tc-btn" id="tc-right" data-act="moveRight">▶</div>
    <div class="tc-btn" id="tc-fire"  data-act="fire">FIRE</div>
    <div class="tc-btn" id="tc-alt"   data-act="altFire">Z</div>
  </div>

  <script>
    // Virtual input state read by the game's InputManager.
    window.__wizTouch = { moveUp:false, moveDown:false, moveLeft:false, moveRight:false, fire:false, altFire:false };

    (function () {
      var isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
      if (isTouch) document.body.classList.add('touch');

      function set(el, act, on) {
        window.__wizTouch[act] = on;
        el.classList.toggle('active', on);
      }
      document.querySelectorAll('.tc-btn').forEach(function (el) {
        var act = el.getAttribute('data-act');
        var down = function (e) { e.preventDefault(); e.stopPropagation(); set(el, act, true); };
        var up   = function (e) { e.preventDefault(); e.stopPropagation(); set(el, act, false); };
        el.addEventListener('pointerdown', down);
        el.addEventListener('pointerup', up);
        el.addEventListener('pointercancel', up);
        el.addEventListener('pointerleave', up);
        el.addEventListener('contextmenu', function (e) { e.preventDefault(); });
      });
      // Safety: release everything if the page loses focus / visibility.
      window.addEventListener('blur', function () {
        for (var k in window.__wizTouch) window.__wizTouch[k] = false;
        document.querySelectorAll('.tc-btn.active').forEach(function (el) { el.classList.remove('active'); });
      });
    })();
  </script>

</body>
</html>
